    function render() {
      if (state.view === 'teams' && !hasInitializedTeamsCollapsedView) {
        collapsedTeamIndexes = new Set(state.teams.map((_, index) => index));
        hasInitializedTeamsCollapsedView = true;
      }
      if (state.view === 'teams' && !hasInitializedSquadsCollapsedView) {
        isSquadsSectionCollapsed = state.squads.length > 1;
        hasInitializedSquadsCollapsedView = true;
      }
      if (state.view === 'sprints' && !hasInitializedPlansCollapsedView) {
        isPlansSectionCollapsed = state.releases.length > 1;
        hasInitializedPlansCollapsedView = true;
      }
      document.getElementById('tabs').innerHTML = renderTabs();
      const viewHtml = {
        home: renderHome,
        velocity: renderVelocity,
        capacity: renderCapacity,
        teams: renderTeams,
        sprints: renderSprints
      }[state.view]();
      document.getElementById('app').innerHTML = `${viewHtml}${renderHelpModal()}${renderPurgeConfirmModal()}${renderDeleteDeveloperConfirmModal()}${renderTeamDeleteBlockedModal()}${renderResetConfirmModal()}`;

      if (pendingSquadFocusIndex !== null) {
        const input = document.querySelector(`[data-action="edit-squad-name"][data-index="${pendingSquadFocusIndex}"]`);
        if (input) {
          input.closest('.row-card')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
          input.focus();
          input.setSelectionRange(0, 0);
        }
        pendingSquadFocusIndex = null;
      }

      if (pendingTeamFocusIndex !== null) {
        const input = document.querySelector(`[data-action="edit-team-name"][data-index="${pendingTeamFocusIndex}"]`);
        if (input) {
          input.closest('.row-card')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
          input.focus();
          input.setSelectionRange(0, 0);
        }
        pendingTeamFocusIndex = null;
      }

      if (pendingDeveloperFocusIndex !== null) {
        const input = document.querySelector(`[data-action="edit-developer-name"][data-index="${pendingDeveloperFocusIndex}"]`);
        if (input) {
          input.closest('.member-row')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
          input.focus();
          input.setSelectionRange(0, 0);
        }
        pendingDeveloperFocusIndex = null;
      }

      updateHeaderOffset();
    }

    function updateHeaderOffset() {
      const header = document.querySelector('.sticky-header');
      const appContainer = document.querySelector('.app');
      const appMain = document.getElementById('app');
      if (!header || !appContainer || !appMain) return;
      const containerTopPadding = Number.parseFloat(getComputedStyle(appContainer).paddingTop) || 0;
      appMain.style.paddingTop = `${Math.max(0, header.offsetHeight - containerTopPadding)}px`;
    }

    document.addEventListener('click', (event) => {
      if (event.target.closest('[data-help-modal]') && !event.target.closest('[data-action]')) {
        return;
      }
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      if ((action === 'delete-team' || action === 'show-team-delete-blocked') && target.closest('summary')) {
        event.preventDefault();
        event.stopPropagation();
      }

      if (action === 'set-view') {
        const nextView = target.dataset.view;
        const isEnteringSprints = state.view !== 'sprints' && nextView === 'sprints';
        state.view = nextView;
        if (isEnteringSprints) {
          syncPlanToCurrentSprint();
        }
        saveState();
        render();
        return;
      }
      if (action === 'toggle-help') {
        isHelpOpen = !isHelpOpen;
        render();
        return;
      }
      if (action === 'close-help') {
        isHelpOpen = false;
        render();
        return;
      }
      if (action === 'confirm-purge') {
        confirmPurgeOldSprints();
        render();
        return;
      }
      if (action === 'cancel-purge') {
        cancelPurgeOldSprints();
        return;
      }
      if (action === 'confirm-delete-developer') {
        isDeleteDeveloperConfirmOpen = false;
        if (deleteDeveloperIndex !== null) {
          deleteDeveloper(deleteDeveloperIndex);
        }
        deleteDeveloperIndex = null;
        deleteDeveloperName = null;
        return;
      }
      if (action === 'cancel-delete-developer') {
        isDeleteDeveloperConfirmOpen = false;
        deleteDeveloperIndex = null;
        deleteDeveloperName = null;
        render();
        return;
      }
      if (action === 'close-team-delete-blocked') {
        isTeamDeleteBlockedOpen = false;
        render();
        return;
      }
      if (action === 'confirm-reset') {
        isResetConfirmOpen = false;
        freshStart();
        return;
      }
      if (action === 'cancel-reset') {
        isResetConfirmOpen = false;
        render();
        return;
      }
      if (action === 'set-velocity-mode') {
        const nextMode = target.dataset.mode;
        state.velocityMode = nextMode;
        if (nextMode === 'sprint') {
          state.currentSprintIndex = state.masterSprintIndex;
        }
        saveState();
        render();
        return;
      }
      if (action === 'toggle-squads-section') {
        isSquadsSectionCollapsed = !isSquadsSectionCollapsed;
        render();
        return;
      }
      if (action === 'toggle-plans-section') {
        isPlansSectionCollapsed = !isPlansSectionCollapsed;
        render();
        return;
      }
      if (action === 'open-teams-squads') {
        state.view = 'teams';
        isSquadsSectionCollapsed = false;
        hasInitializedSquadsCollapsedView = true;
        saveState();
        render();
        return;
      }
      if (action === 'open-sprints') {
        const isEnteringSprints = state.view !== 'sprints';
        state.view = 'sprints';
        if (isEnteringSprints) {
          syncPlanToCurrentSprint();
        }
        saveState();
        render();
        return;
      }
      if (action === 'open-teams') {
        state.view = 'teams';
        isSquadsSectionCollapsed = true;
        hasInitializedSquadsCollapsedView = true;
        saveState();
        render();
        return;
      }
      if (action === 'open-developers') {
        state.view = 'teams';
        isSquadsSectionCollapsed = true;
        hasInitializedSquadsCollapsedView = true;
        saveState();
        render();
        return;
      }
      if (action === 'open-missing-actuals') {
        const previousSprintIndex = state.masterSprintIndex - 1;
        let targetSquadIndex = state.currentSquadIndex;
        if (previousSprintIndex >= 0) {
          const missingBySquad = state.squads.map((_, squadIndex) => {
            const teamIndexes = state.teams
              .map((team, teamIndex) => ({ team, teamIndex }))
              .filter(({ team }) => team.squadIndex === squadIndex)
              .map(({ teamIndex }) => teamIndex);
            const missingCount = teamIndexes.reduce((count, teamIndex) => {
              const actual = numberValue(state.teamVelocity[teamIndex]?.[previousSprintIndex]?.actual);
              return actual > 0 ? count : count + 1;
            }, 0);
            return { squadIndex, missingCount };
          });
          targetSquadIndex = missingBySquad.reduce((best, current) => (
            current.missingCount > best.missingCount ? current : best
          ), { squadIndex: state.currentSquadIndex, missingCount: -1 }).squadIndex;
          state.currentSprintIndex = previousSprintIndex;
        }

        state.view = 'velocity';
        state.velocityMode = 'sprint';
        state.currentSquadIndex = targetSquadIndex;
        normalizeState(state);
        recomputeDerived();
        saveState();
        render();
        return;
      }
      if (action === 'reset-data') {
        isResetConfirmOpen = true;
        render();
        return;
      }
      if (action === 'save-now') {
        saveState();
        showTopbarToast('Data saved');
        return;
      }
      if (action === 'export-data') {
        exportStateToFile();
        return;
      }
      if (action === 'import-data') {
        if (!confirm('Importing will overwrite any existing data. Do you want to continue?')) {
          return;
        }
        const input = document.querySelector('input[data-action="import-data-file"]');
        input?.click();
        return;
      }
      if (action === 'add-squad') return addSquad();
      if (action === 'delete-squad') return deleteSquad(Number(target.dataset.index));
      if (action === 'show-squad-delete-blocked') {
        alert('Unable to delete a Squad that has teams.  Please delete its teams first.');
        return;
      }
      if (action === 'add-team') return addTeam(Number(target.dataset.index));
      if (action === 'show-team-delete-blocked') {
        const teamIndex = Number(target.dataset.index);
        collapsedTeamIndexes.delete(teamIndex);
        isTeamDeleteBlockedOpen = true;
        render();
        return;
      }
      if (action === 'show-purge-sprints-blocked') {
        alert('More than 10 sprints needed to bulk delete old sprints');
        return;
      }
      if (action === 'delete-team') return deleteTeam(Number(target.dataset.index));
      if (action === 'add-developer') return addDeveloper(Number(target.dataset.index));
      if (action === 'reset-team-capacity-sprint') return resetSelectedTeamCapacityForSprint();
      if (action === 'delete-developer') {
        if (state.developers.length < 2) return;
        const index = Number(target.dataset.index);
        const developerName = state.developers[index]?.name ?? 'this team member';
        isDeleteDeveloperConfirmOpen = true;
        deleteDeveloperIndex = index;
        deleteDeveloperName = developerName;
        render();
        return;
      }
      if (action === 'add-sprint') return addSprint();
      if (action === 'add-release') return addRelease();
      if (action === 'delete-release') {
        if (state.releases.length < 2) return;
        const index = Number(target.dataset.index);
        const releaseName = state.releases[index]?.name ?? 'this plan';
        const assignedSprintCount = state.sprints.reduce((count, sprint) => (
          sprint.releaseIndex === index ? count + 1 : count
        ), 0);
        if (assignedSprintCount > 0 && !confirm(`Delete ${releaseName}? ${assignedSprintCount} sprint${assignedSprintCount === 1 ? '' : 's'} will be unassigned.`)) return;
        return deleteRelease(index);
      }
      if (action === 'delete-sprint') {
        if (state.sprints.length < 2) return;
        const index = Number(target.dataset.index);
        const sprintName = state.sprints[index]?.name ?? 'this sprint';
        if (!confirm(`Delete ${sprintName}?`)) return;
        return deleteSprint(index);
      }
      if (action === 'purge-sprints') return purgeOldSprints();
      if (action === 'set-current-sprint') return setCurrentSprint(Number(target.dataset.index));
      if (action === 'set-current-squad') {
        state.currentSquadIndex = Number(target.dataset.index);
        normalizeState(state);
        recomputeDerived();
        saveState();
        render();
        return;
      }
      if (action === 'set-current-plan') {
        state.currentPlanIndex = Number(target.dataset.index);
        normalizeState(state);
        saveState();
        render();
        return;
      }
      if (action === 'set-current-team') {
        state.currentTeamIndex = Number(target.dataset.index);
        state.currentSquadIndex = state.teams[state.currentTeamIndex]?.squadIndex ?? state.currentSquadIndex;
        normalizeState(state);
        recomputeDerived();
        saveState();
        render();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && isHelpOpen) {
        isHelpOpen = false;
        render();
        return;
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const eventTarget = event.target instanceof Element ? event.target : null;
      const target = eventTarget?.closest('.snapshot-stat.clickable[data-action]');
      if (!target) return;
      event.preventDefault();
      target.click();
    });

    document.addEventListener('dragstart', (event) => {
      const row = event.target.closest('[data-sprint-row]');
      if (!row) return;

      draggedSprintIndex = Number(row.dataset.index);
      row.classList.add('is-dragging');

      if (event.dataTransfer) {
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', String(draggedSprintIndex));
      }
    });

    document.addEventListener('dragover', (event) => {
      const row = event.target.closest('[data-sprint-row]');
      if (!row || draggedSprintIndex === null) return;

      event.preventDefault();
      const rect = row.getBoundingClientRect();
      const placeAfter = event.clientY >= rect.top + (rect.height / 2);
      const wrap = row.closest('.sprints-table-wrap');
      const dropLine = wrap?.querySelector('.sprint-drop-line');
      const rows = Array.from(document.querySelectorAll('[data-sprint-row]'));
      const rowPosition = rows.indexOf(row);
      const gapIndexDom = rowPosition + (placeAfter ? 1 : 0);
      const sourceDomPos = rows.findIndex((item) => Number(item.dataset.index) === draggedSprintIndex);
      const isNoOpGap = gapIndexDom === sourceDomPos || gapIndexDom === sourceDomPos + 1;

      document.querySelectorAll('[data-sprint-row]').forEach((item) => item.classList.remove('drop-before', 'drop-after'));
      if (!isNoOpGap) {
        sprintDropPlacement = { gapIndexDom };
        if (dropLine && wrap) {
          const wrapRect = wrap.getBoundingClientRect();
          let lineY = rect.top;
          if (gapIndexDom <= 0) {
            lineY = rows[0]?.getBoundingClientRect().top ?? rect.top;
          } else if (gapIndexDom >= rows.length) {
            lineY = rows[rows.length - 1]?.getBoundingClientRect().bottom ?? rect.bottom;
          } else {
            const prevRect = rows[gapIndexDom - 1].getBoundingClientRect();
            const nextRect = rows[gapIndexDom].getBoundingClientRect();
            lineY = (prevRect.bottom + nextRect.top) / 2;
          }
          dropLine.style.top = `${lineY - wrapRect.top - 2}px`;
          dropLine.style.display = 'block';
        }
      } else {
        sprintDropPlacement = null;
        if (dropLine) {
          dropLine.style.display = 'none';
        }
      }

      if (event.dataTransfer) {
        event.dataTransfer.dropEffect = 'move';
      }
    });

    document.addEventListener('drop', (event) => {
      const row = event.target.closest('[data-sprint-row]');
      if (draggedSprintIndex === null) return;

      event.preventDefault();
      const sourceIndex = draggedSprintIndex;
      const rows = Array.from(document.querySelectorAll('[data-sprint-row]'));
      if (!rows.length) {
        clearSprintDragState();
        return;
      }

      const domIndices = rows.map((item) => Number(item.dataset.index));
      const sourceDomPos = domIndices.indexOf(sourceIndex);
      if (sourceDomPos < 0) {
        clearSprintDragState();
        return;
      }

      let rawGapIndex = sprintDropPlacement?.gapIndexDom;
      if (!Number.isInteger(rawGapIndex) && row) {
        const rect = row.getBoundingClientRect();
        const placeAfter = event.clientY >= rect.top + (rect.height / 2);
        const rowPosition = rows.indexOf(row);
        rawGapIndex = rowPosition + (placeAfter ? 1 : 0);
      }
      if (!Number.isInteger(rawGapIndex)) {
        clearSprintDragState();
        return;
      }

      if (rawGapIndex === sourceDomPos || rawGapIndex === sourceDomPos + 1) {
        clearSprintDragState();
        return;
      }

      const remaining = domIndices.filter((index) => index !== sourceIndex);
      const insertPos = sourceDomPos < rawGapIndex ? rawGapIndex - 1 : rawGapIndex;
      const clampedInsertPos = Math.max(0, Math.min(insertPos, remaining.length));
      remaining.splice(clampedInsertPos, 0, sourceIndex);

      const destinationDomPos = remaining.indexOf(sourceIndex);
      const destinationIndex = (remaining.length - 1) - destinationDomPos;

      clearSprintDragState();
      if (destinationIndex !== sourceIndex) {
        moveSprint(sourceIndex, destinationIndex);
      }
    });

    document.addEventListener('dragend', () => {
      clearSprintDragState();
      clearPlanDragState();
    });

    document.addEventListener('dragstart', (event) => {
      const row = event.target.closest('[data-plan-row]');
      if (!row) return;

      draggedPlanIndex = Number(row.dataset.index);
      row.classList.add('is-dragging');

      if (event.dataTransfer) {
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', String(draggedPlanIndex));
      }
    });

    document.addEventListener('dragover', (event) => {
      const row = event.target.closest('[data-plan-row]');
      if (!row || draggedPlanIndex === null) return;

      event.preventDefault();
      const rect = row.getBoundingClientRect();
      const placeAfter = event.clientY >= rect.top + (rect.height / 2);
      const wrap = row.closest('.row-stack');
      const dropLine = wrap?.querySelector('.plan-drop-line');
      const rows = Array.from(document.querySelectorAll('[data-plan-row]'));
      const rowPosition = rows.indexOf(row);
      const gapIndexDom = rowPosition + (placeAfter ? 1 : 0);
      const sourceDomPos = rows.findIndex((item) => Number(item.dataset.index) === draggedPlanIndex);
      const isNoOpGap = gapIndexDom === sourceDomPos || gapIndexDom === sourceDomPos + 1;

      document.querySelectorAll('[data-plan-row]').forEach((item) => item.classList.remove('drop-before', 'drop-after'));
      if (!isNoOpGap) {
        planDropPlacement = { gapIndexDom };
        if (dropLine && wrap) {
          const wrapRect = wrap.getBoundingClientRect();
          let lineY = rect.top;
          if (gapIndexDom <= 0) {
            lineY = rows[0]?.getBoundingClientRect().top ?? rect.top;
          } else if (gapIndexDom >= rows.length) {
            lineY = rows[rows.length - 1]?.getBoundingClientRect().bottom ?? rect.bottom;
          } else {
            const prevRect = rows[gapIndexDom - 1].getBoundingClientRect();
            const nextRect = rows[gapIndexDom].getBoundingClientRect();
            lineY = (prevRect.bottom + nextRect.top) / 2;
          }
          dropLine.style.top = `${lineY - wrapRect.top - 2}px`;
          dropLine.style.display = 'block';
        }
      } else {
        planDropPlacement = null;
        if (dropLine) {
          dropLine.style.display = 'none';
        }
      }

      if (event.dataTransfer) {
        event.dataTransfer.dropEffect = 'move';
      }
    });

    document.addEventListener('drop', (event) => {
      const row = event.target.closest('[data-plan-row]');
      if (draggedPlanIndex === null) return;

      event.preventDefault();
      const sourceIndex = draggedPlanIndex;
      const rows = Array.from(document.querySelectorAll('[data-plan-row]'));
      if (!rows.length) {
        clearPlanDragState();
        return;
      }

      const domIndices = rows.map((item) => Number(item.dataset.index));
      const sourceDomPos = domIndices.indexOf(sourceIndex);
      if (sourceDomPos < 0) {
        clearPlanDragState();
        return;
      }

      let rawGapIndex = planDropPlacement?.gapIndexDom;
      if (!Number.isInteger(rawGapIndex) && row) {
        const rect = row.getBoundingClientRect();
        const placeAfter = event.clientY >= rect.top + (rect.height / 2);
        const rowPosition = rows.indexOf(row);
        rawGapIndex = rowPosition + (placeAfter ? 1 : 0);
      }
      if (!Number.isInteger(rawGapIndex)) {
        clearPlanDragState();
        return;
      }

      if (rawGapIndex === sourceDomPos || rawGapIndex === sourceDomPos + 1) {
        clearPlanDragState();
        return;
      }

      const remaining = domIndices.filter((index) => index !== sourceIndex);
      const insertPos = sourceDomPos < rawGapIndex ? rawGapIndex - 1 : rawGapIndex;
      const clampedInsertPos = Math.max(0, Math.min(insertPos, remaining.length));
      remaining.splice(clampedInsertPos, 0, sourceIndex);

      const destinationDomPos = remaining.indexOf(sourceIndex);
      const destinationIndex = destinationDomPos;

      clearPlanDragState();
      if (destinationIndex !== sourceIndex) {
        moveRelease(sourceIndex, destinationIndex);
      }
    });

    document.addEventListener('toggle', (event) => {
      const details = event.target.closest('[data-action="toggle-team-section"]');
      if (!details) return;
      const index = Number(details.dataset.index);
      if (!Number.isInteger(index)) return;
      if (details.open) {
        collapsedTeamIndexes.delete(index);
      } else {
        collapsedTeamIndexes.add(index);
      }
    });

    document.addEventListener('keydown', (event) => {
      const eventTarget = event.target instanceof Element ? event.target : null;
      const target = eventTarget?.closest('[data-action="edit-developer-name"]');
      if (!target) return;
      if (event.key.length !== 1 || event.ctrlKey || event.metaKey || event.altKey) return;
      if (target.value === DEFAULT_NEW_DEVELOPER_NAME) {
        target.value = '';
        target.classList.remove('default-dev-name');
      }
    });

    document.addEventListener('keydown', (event) => {
      const eventTarget = event.target instanceof Element ? event.target : null;
      const target = eventTarget?.closest('[data-action="edit-squad-name"]');
      if (!target) return;
      if (event.key.length !== 1 || event.ctrlKey || event.metaKey || event.altKey) return;
      if (target.value === DEFAULT_NEW_SQUAD_NAME) {
        target.value = '';
        target.classList.remove('default-squad-name');
      }
    });

    document.addEventListener('keydown', (event) => {
      const eventTarget = event.target instanceof Element ? event.target : null;
      const target = eventTarget?.closest('[data-action="edit-team-name"]');
      if (!target) return;
      if (event.key.length !== 1 || event.ctrlKey || event.metaKey || event.altKey) return;
      if (target.value === DEFAULT_NEW_TEAM_NAME) {
        target.value = '';
        target.classList.remove('default-team-name');
      }
    });

    document.addEventListener('input', (event) => {
      const target = event.target.closest('[data-action="edit-developer-name"]');
      if (!target) return;
      const developerIndex = Number(target.dataset.index);
      if (Number.isInteger(developerIndex) && state.developers[developerIndex]) {
        state.developers[developerIndex].name = target.value;
        saveState();
      }
      if (target.value === DEFAULT_NEW_DEVELOPER_NAME) {
        target.classList.add('default-dev-name');
      } else {
        target.classList.remove('default-dev-name');
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') return;
      const target = event.target.closest('[data-action="edit-developer-name"]');
      if (!target) return;
      const developerIndex = Number(target.dataset.index);
      if (!Number.isInteger(developerIndex) || !state.developers[developerIndex]) return;
      
      const developer = state.developers[developerIndex];
      const teamIndex = developer.teamIndex;
      
      // Count developers in this team and find if this is the last one
      const developersInTeam = state.developers.filter(dev => dev.teamIndex === teamIndex);
      const isLastInTeam = developersInTeam[developersInTeam.length - 1] === developer;
      
      // If this is the last developer in the team, add a new one
      if (isLastInTeam) {
        event.preventDefault();
        addDeveloper(teamIndex);
      }
    });

    document.addEventListener('input', (event) => {
      const target = event.target.closest('[data-action="edit-squad-name"]');
      if (!target) return;
      const squadIndex = Number(target.dataset.index);
      if (Number.isInteger(squadIndex) && state.squads[squadIndex]) {
        state.squads[squadIndex].name = target.value;
        saveState();
      }
      if (target.value === DEFAULT_NEW_SQUAD_NAME) {
        target.classList.add('default-squad-name');
      } else {
        target.classList.remove('default-squad-name');
      }
    });

    document.addEventListener('input', (event) => {
      const target = event.target.closest('[data-action="edit-capacity"]');
      if (!target) return;
      target.classList.remove('default-available');
    });

    document.addEventListener('input', (event) => {
      const target = event.target.closest('[data-action="edit-release-name"]');
      if (!target) return;
      const releaseIndex = Number(target.dataset.index);
      if (Number.isInteger(releaseIndex) && state.releases[releaseIndex]) {
        state.releases[releaseIndex].name = target.value;
        saveState();
      }
    });

    document.addEventListener('input', (event) => {
      const target = event.target.closest('[data-action="edit-team-name"]');
      if (!target) return;
      const teamIndex = Number(target.dataset.index);
      if (Number.isInteger(teamIndex) && state.teams[teamIndex]) {
        state.teams[teamIndex].name = target.value;
        saveState();
      }
      if (target.value === DEFAULT_NEW_TEAM_NAME) {
        target.classList.add('default-team-name');
      } else {
        target.classList.remove('default-team-name');
      }
    });

    document.addEventListener('change', (event) => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      const index = Number(target.dataset.index);

      if (action === 'import-data-file') {
        const file = target.files?.[0];
        importStateFromFile(file);
        target.value = '';
        return;
      }

      if (action === 'select-squad') {
        state.currentSquadIndex = Number(target.value);
        const firstTeam = getSelectedTeamIndexForSquad(state.currentSquadIndex);
        if (firstTeam >= 0) state.currentTeamIndex = firstTeam;
        normalizeState(state);
        recomputeDerived();
        saveState();
        render();
        return;
      }
      if (action === 'select-plan') {
        state.currentPlanIndex = Number(target.value);
        normalizeState(state);
        saveState();
        render();
        return;
      }
      if (action === 'toggle-selected-plan-sprints') {
        state.showSelectedPlanSprintsOnly = target.checked;
        saveState();
        render();
        return;
      }
      if (action === 'select-velocity-plan') {
        state.currentPlanIndex = Number(target.value);
        normalizeState(state);
        recomputeDerived();
        saveState();
        render();
        return;
      }
      if (action === 'select-team') {
        state.currentTeamIndex = Number(target.value);
        state.currentSquadIndex = state.teams[state.currentTeamIndex]?.squadIndex ?? state.currentSquadIndex;
        normalizeState(state);
        recomputeDerived();
        saveState();
        render();
        return;
      }
      if (action === 'select-sprint') {
        state.currentSprintIndex = Number(target.value);
        normalizeState(state);
        recomputeDerived();
        saveState();
        render();
        return;
      }
      if (action === 'edit-developer-name') {
        return;
      }
      if (action === 'edit-team-name') {
        return;
      }
      if (action === 'edit-release-name') {
        return;
      }
      if (action === 'edit-squad-name') {
        return;
      }
      if (action === 'edit-team-squad') {
        state.teams[index].squadIndex = Number(target.value);
      } else if (action === 'edit-sprint-release') {
        if (!state.sprints[index]) return;
        const nextReleaseIndex = target.value === '' ? null : Number(target.value);
        state.sprints[index].releaseIndex = Number.isInteger(nextReleaseIndex)
          && nextReleaseIndex >= 0
          && nextReleaseIndex < state.releases.length
          ? nextReleaseIndex
          : null;
      } else if (action === 'edit-sprint-name') {
        state.sprints[index].name = target.value;
      } else if (action === 'edit-sprint-days') {
        state.sprints[index].days = numberValue(target.value) || 0;
        state.developerCapacity.forEach((row) => {
          if (!row[index]) return;
          row[index].capacity = clampCapacityToSprintDays(row[index].capacity, index);
        });
      } else if (action === 'edit-capacity') {
        const developerIndex = Number(target.dataset.developer);
        const sprintIndex = Number(target.dataset.sprint);
        const validationMessage = getCapacityValidationMessage(target.value, sprintIndex);
        state.developerCapacity[developerIndex][sprintIndex].capacity = clampCapacityToSprintDays(target.value, sprintIndex);
        state.developerCapacity[developerIndex][sprintIndex].isDefault = false;
        if (validationMessage) {
          showCapacityToast(developerIndex, sprintIndex, validationMessage);
        }
      } else if (action === 'edit-velocity') {
        const teamIndex = Number(target.dataset.team);
        const sprintIndex = Number(target.dataset.sprint);
        const field = target.dataset.field;
        if ((field === 'actual' || field === 'commit') && sprintIndex > state.masterSprintIndex) {
          return;
        }
        state.teamVelocity[teamIndex][sprintIndex][field] = numberValue(target.value);
      } else {
        return;
      }

      normalizeState(state);
      recomputeDerived();
      saveState();
      render();
    });

    window.addEventListener('resize', updateHeaderOffset);

    recomputeDerived();
    saveState();
    render();
  </script>
</body>
</html>
