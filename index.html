<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Capacity Planning</title>
  <style>
    :root {
      --accent: rgb(74, 136, 180);
      --accent-strong: rgb(53, 107, 146);
      --bg: #eef4f9;
      --panel: #ffffff;
      --panel-soft: #f7fafc;
      --text: #17212b;
      --muted: #667381;
      --border: #d8e2ea;
      --control-border: 1px solid var(--border);
      --elevation-card: 0 1px 2px rgba(16, 24, 40, 0.08);
      --shadow: var(--elevation-card);
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html {
      scrollbar-gutter: stable;
    }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }
    input, select {
      width: 100%;
      border: var(--control-border);
      border-radius: 10px;
      background: #fff;
      padding: 10px 12px;
      color: var(--text);
    }
    input:disabled {
      background: #f5f7fa;
      color: #6f7a86;
      opacity: 1;
    }
    input:focus, select:focus, button:focus {
      outline: 2px solid rgba(74, 136, 180, 0.25);
      outline-offset: 2px;
    }

    .app {
      max-width: 1440px;
      margin: 0 auto;
      padding: var(--space-5);
    }
    .sticky-header {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(1440px, calc(100vw - (2 * var(--space-5))));
      z-index: 50;
    }
    .sticky-header::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      pointer-events: none;
      z-index: -1;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: var(--space-4);
      align-items: center;
      flex-wrap: wrap;
      margin-top: 14px;
      margin-bottom: 2px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .topbar-actions {
      margin-left: auto;
      justify-content: flex-end;
      flex-wrap: nowrap;
    }
    .topbar-toast {
      font-size: 0.82rem;
      color: var(--accent-strong);
      background: rgba(74, 136, 180, 0.12);
      border: 1px solid rgba(74, 136, 180, 0.24);
      border-radius: 999px;
      padding: 7px 10px;
      white-space: nowrap;
      opacity: 0;
      transform: translateX(6px);
      transition: opacity 0.18s ease, transform 0.18s ease;
      pointer-events: none;
    }
    .topbar-toast.is-visible {
      opacity: 1;
      transform: translateX(0);
    }
    .icon-btn {
      width: 40px;
      min-width: 40px;
      height: 40px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      line-height: 1;
    }
    .help-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(23, 33, 43, 0.38);
      z-index: 110;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .help-modal {
      width: min(680px, calc(100vw - 24px));
      max-height: min(80vh, 760px);
      overflow-y: auto;
      background: var(--panel);
      border: var(--control-border);
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(16, 24, 40, 0.2);
      padding: 18px;
    }
    .help-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .help-list {
      margin: 0;
      padding-left: 20px;
      color: var(--text);
      line-height: 1.35;
      display: grid;
      gap: 8px;
    }
    .storage-action-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: var(--space-3);
      margin-top: var(--space-3);
    }
    .storage-action {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-1);
      background: var(--panel-soft);
      border: var(--control-border);
      border-radius: 12px;
      padding: var(--space-3);
      text-align: center;
      min-height: 156px;
      box-shadow: var(--elevation-card);
    }
    .storage-action.clickable {
      cursor: pointer;
    }
    .storage-action.clickable:hover {
      border-color: rgba(74, 136, 180, 0.35);
      background: #f3f8fc;
    }
    .storage-icon-btn {
      width: 42px;
      min-width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      line-height: 1;
    }
    .storage-action-title {
      font-size: 0.82rem;
      font-weight: 650;
      color: var(--text);
      line-height: 1.2;
    }
    .storage-action-text {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.25;
    }
    .storage-action-meta {
      white-space: nowrap;
      margin-top: auto;
    }
    .storage-action-reset {
      min-height: 0;
    }

    .logo {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      flex: 0 0 52px;
      display: block;
    }
    .logo svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 1.4rem; }
    .subtle { color: var(--muted); font-size: 0.92rem; margin-top: 4px; }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin: 18px 0 calc(var(--space-5) / 2);
      padding: var(--space-3) 0;
    }

    .tab-btn, .ghost-btn, .primary-btn, .danger-btn, .seg-btn {
      border: var(--control-border);
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 14px;
      transition: transform 0.12s ease, background 0.12s ease, color 0.12s ease;
    }
    .tab-btn:hover, .ghost-btn:hover, .primary-btn:hover, .danger-btn:hover, .seg-btn:hover {
      transform: translateY(-1px);
    }
    .tab-btn.active, .seg-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .primary-btn {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .danger-btn {
      background: #d9534f;
      color: #fff;
      border-color: #d9534f;
    }
    .danger-btn:disabled {
      background: #8a8f98;
      border-color: #8a8f98;
      color: #fff;
      cursor: not-allowed;
    }
    .danger-btn.blocked-delete-btn {
      background: #8a8f98;
      border-color: #8a8f98;
      color: #fff;
    }
    .ghost-btn {
      background: #fff;
    }
    .current-sprint-btn {
      min-width: 58px;
      text-align: center;
      padding: 8px 4px;
    }
    .current-sprint-btn.is-current {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .squad-delete-btn {
      min-width: 92px;
      text-align: center;
    }
    .squad-select-btn {
      min-width: 92px;
      text-align: center;
    }
    .squad-selected-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 92px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: rgba(74, 136, 180, 0.12);
      color: var(--accent-strong);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: default;
    }
    .team-delete-btn {
      min-width: 92px;
      text-align: center;
    }

    .stack { display: grid; gap: var(--space-4); }
    .grid {
      display: grid;
      gap: var(--space-4);
    }
    .summary-grid {
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    }
    .summary-tiles-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .summary-tiles-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .summary-box-format .card,
    .summary-box-format .card h3,
    .summary-box-format .card .metric,
    .summary-box-format .card .footnote {
      text-align: center;
    }
    .summary-box-format .card {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(1.15rem, auto) 1fr minmax(1rem, auto);
      justify-items: stretch;
      align-items: center;
      gap: var(--space-1);
      min-height: 118px;
      padding-top: var(--space-3);
      padding-bottom: var(--space-3);
    }
    .summary-box-format .card h3,
    .summary-box-format .card .footnote {
      margin: 0;
      line-height: 1.1;
      width: max-content;
      max-width: 100%;
      justify-self: center;
    }
    .summary-box-format .card .metric {
      margin: 0;
      align-self: center;
      width: max-content;
      max-width: 100%;
      justify-self: center;
    }
    .summary-box-format .card .section-title {
      justify-content: center;
    }
    .summary-box-format .card .footnote {
      white-space: nowrap;
    }
    .summary-box-format .card.velocity-forecast-alert {
      background: rgba(217, 83, 79, 0.08);
      border-color: rgba(217, 83, 79, 0.35);
    }
    .summary-box-format .card.velocity-forecast-alert h3,
    .summary-box-format .card.velocity-forecast-alert .metric,
    .summary-box-format .card.velocity-forecast-alert .footnote {
      color: #b13c39;
    }
    .two-col {
      grid-template-columns: minmax(280px, 1fr) minmax(0, 2fr);
    }
    .three-col {
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }
    .velocity-sprint-stack {
      grid-template-columns: 1fr;
    }
    .velocity-team-stack {
      grid-template-columns: 1fr;
    }
    .selector-stack {
      display: grid;
      gap: 12px;
    }

    .card {
      background: var(--panel);
      border: var(--control-border);
      border-radius: var(--radius);
      box-shadow: var(--elevation-card);
      padding: var(--space-4);
    }

    .card h2, .card h3 {
      font-size: 1rem;
      margin-bottom: var(--space-3);
    }

    .metric {
      font-size: 2rem;
      font-weight: 750;
      line-height: 1;
      margin: 8px 0;
    }

    .footnote, .meta {
      color: var(--muted);
      font-size: 0.86rem;
    }
    .selection-info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .selection-info-card {
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .selection-info-value {
      font-size: 1rem;
      font-weight: 650;
      line-height: 1.2;
    }
    .snapshot-layout {
      display: grid;
      gap: 12px;
    }
    .snapshot-hero {
      background: linear-gradient(135deg, rgba(74, 136, 180, 0.13), rgba(74, 136, 180, 0.04));
      border: 1px solid rgba(74, 136, 180, 0.25);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
    }
    .snapshot-hero-label {
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-strong);
      font-weight: 700;
    }
    .snapshot-hero-value {
      font-size: 1.7rem;
      line-height: 1;
      font-weight: 750;
      margin-top: 6px;
      margin-bottom: 4px;
    }
    .snapshot-progress {
      margin-top: 8px;
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: rgba(74, 136, 180, 0.18);
      overflow: hidden;
    }
    .snapshot-progress > span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #5aa3d4, #2f7fb8);
    }
    .snapshot-stat-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .snapshot-stat {
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 11px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .snapshot-stat.clickable {
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease;
    }
    .snapshot-stat.clickable::before {
      content: "↗";
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 0.75rem;
      color: var(--accent-strong);
      opacity: 0.8;
    }
    .snapshot-stat.clickable:hover {
      background: #eef6ff;
      border-color: rgba(74, 136, 180, 0.35);
    }
    .snapshot-stat.clickable:focus-visible {
      outline: 2px solid rgba(74, 136, 180, 0.35);
      outline-offset: 2px;
    }
    .snapshot-stat.warn {
      background: rgba(217, 83, 79, 0.08);
      border-color: rgba(217, 83, 79, 0.35);
    }
    .snapshot-stat.warn .snapshot-stat-label,
    .snapshot-stat.warn .snapshot-stat-value {
      color: #b13c39;
    }
    .snapshot-stat.warn.clickable::before {
      color: #b13c39;
    }
    .snapshot-stat.full-width {
      grid-column: 1 / -1;
    }
    .snapshot-stat-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .snapshot-stat-value {
      font-size: 1.08rem;
      font-weight: 700;
      line-height: 1.1;
    }
    .current-sprint-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) fit-content(156px);
      align-items: stretch;
      gap: 12px;
    }
    .current-sprint-hero {
      background: linear-gradient(135deg, rgba(74, 136, 180, 0.14), rgba(74, 136, 180, 0.05));
      border: 1px solid rgba(74, 136, 180, 0.25);
      border-radius: 14px;
      padding: 12px;
    }
    .current-sprint-name {
      font-size: 1.75rem;
      font-weight: 760;
      line-height: 1.05;
      margin: 0;
    }
    .current-sprint-meta-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .current-sprint-meta {
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 11px;
    }
    .current-sprint-meta .label {
      margin-bottom: 4px;
      white-space: nowrap;
      text-align: center;
    }
    .current-sprint-meta-value {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.1;
      text-align: center;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .velocity-sprint-toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 300px);
      align-items: end;
      gap: 16px;
    }
    .velocity-sprint-toolbar .segmented {
      justify-self: start;
    }
    .velocity-squad-picker {
      justify-self: end;
      width: 100%;
      max-width: 280px;
    }
    .velocity-squad-picker label {
      margin: 0;
    }

    .segmented {
      display: inline-flex;
      gap: 6px;
      padding: 4px;
      border-radius: 999px;
      background: var(--panel-soft);
      border: 1px solid var(--border);
    }
    .seg-btn {
      border: 0;
      background: transparent;
    }

    .fields {
      display: grid;
      gap: 12px;
    }
    .fields.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .fields.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
      flex-wrap: wrap;
    }
    .squads-toggle-btn {
      border: 0;
      background: transparent;
      padding: 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
    }
    .squads-toggle-btn:hover {
      transform: none;
    }
    .squads-toggle-icon {
      color: var(--muted);
      font-size: 2.3rem;
      line-height: 1;
      font-weight: 400;
      display: inline-block;
      width: 1em;
      text-align: center;
      transform: translateY(-0.125em);
      align-self: center;
    }
    .squads-collapsed-select {
      max-width: 320px;
    }

    .table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 10px;
    }
    .table th {
      text-align: left;
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0 12px;
    }
    .table td {
      background: #fff;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
    }
    .table td:first-child {
      border-left: 1px solid var(--border);
      border-top-left-radius: 14px;
      border-bottom-left-radius: 14px;
    }
    .table td:last-child {
      border-right: 1px solid var(--border);
      border-top-right-radius: 14px;
      border-bottom-right-radius: 14px;
    }
    .table tbody tr:hover td {
      background: #f4f9ff;
      border-top-color: #c9ddec;
      border-bottom-color: #c9ddec;
    }
    .table tbody tr:hover td:first-child {
      border-left-color: #c9ddec;
    }
    .table tbody tr:hover td:last-child {
      border-right-color: #c9ddec;
    }
    .table td:focus-within {
      background: #eef6ff;
      border-top-color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .table td:first-child:focus-within {
      border-left-color: var(--accent);
    }
    .table td:last-child:focus-within {
      border-right-color: var(--accent);
    }
    .table td input:focus {
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 2px rgba(74, 136, 180, 0.14);
    }
    .table td input.missing-previous-data-input {
      color: #b13c39;
      border-color: rgba(217, 83, 79, 0.45);
      background: rgba(217, 83, 79, 0.08);
    }
    .sprint-table {
      table-layout: fixed;
      width: 100%;
      min-width: 0;
      border-collapse: collapse;
      border-spacing: 0;
    }
    .sprint-table th:nth-child(1),
    .sprint-table td:nth-child(1) {
      width: 34%;
    }
    .sprint-table th:nth-child(2),
    .sprint-table td:nth-child(2),
    .sprint-table th:nth-child(3),
    .sprint-table td:nth-child(3),
    .sprint-table th:nth-child(4),
    .sprint-table td:nth-child(4),
    .sprint-table th:nth-child(5),
    .sprint-table td:nth-child(5) {
      width: 16.5%;
    }
    .sprint-table td {
      overflow: hidden;
    }
    .sprint-table th,
    .sprint-table td {
      padding-left: 6px;
      padding-right: 6px;
    }
    .sprint-table th {
      white-space: normal;
      line-height: 1.15;
      font-size: 0.72rem;
    }
    .sprint-table input {
      min-width: 0;
    }
    .sprints-table-wrap {
      overflow-x: auto;
      position: relative;
    }
    .sprints-table {
      table-layout: fixed;
      width: 100%;
      min-width: 0;
    }
    .sprints-table th:nth-child(1),
    .sprints-table td:nth-child(1) {
      width: 44px;
      text-align: center;
    }
    .sprints-table th:nth-child(2),
    .sprints-table td:nth-child(2) {
      width: 78px;
      text-align: center;
    }
    .sprints-table th:nth-child(3),
    .sprints-table td:nth-child(3),
    .sprints-table th:nth-child(4),
    .sprints-table td:nth-child(4) {
      width: calc((100% - 272px) / 2);
      text-align: left;
    }
    .sprints-table th:nth-child(5),
    .sprints-table td:nth-child(5) {
      width: 52px;
      text-align: right;
    }
    .sprints-table th:nth-child(6),
    .sprints-table td:nth-child(6) {
      width: 84px;
      text-align: right;
    }
    .sprints-table th:nth-child(5) {
      text-align: center;
    }
    .sprints-table th:nth-child(6) {
      text-align: right;
    }
    .sprints-table th,
    .sprints-table td {
      padding-left: 6px;
      padding-right: 6px;
    }
    .sprints-table th:nth-child(5),

      update((draft) => {
        if (!canDeleteSquad(index)) return;
        draft.squads.splice(index, 1);
        draft.teams = draft.teams.map((team) => ({
          ...team,
          squadIndex: team.squadIndex > index ? team.squadIndex - 1 : team.squadIndex
        }));
        if (draft.currentSquadIndex > index) draft.currentSquadIndex -= 1;
        if (draft.currentSquadIndex >= draft.squads.length) draft.currentSquadIndex = draft.squads.length - 1;
      });
    }

    function addTeam(squadIndex) {
      update((draft) => {
        draft.teams.push({ squadIndex, name: DEFAULT_NEW_TEAM_NAME });
        draft.teamVelocity.push(state.sprints.map(() => ({ commit: 0, actual: 0, capacityDays: 0, estimate: 0, actualPerDay: 0 })));
        draft.currentTeamIndex = draft.teams.length - 1;
        pendingTeamFocusIndex = draft.currentTeamIndex;
        collapsedTeamIndexes = new Set(
          draft.teams
            .map((_, index) => index)
            .filter((index) => index !== draft.currentTeamIndex)
        );
      });
    }

    function deleteTeam(index) {
      update((draft) => {
        if (!canDeleteTeam(index)) return;
        draft.teams.splice(index, 1);
        draft.teamVelocity.splice(index, 1);
        draft.developers = draft.developers.map((developer) => ({
          ...developer,
          teamIndex: developer.teamIndex > index ? developer.teamIndex - 1 : developer.teamIndex
        }));
        if (draft.currentTeamIndex > index) draft.currentTeamIndex -= 1;
        if (draft.currentTeamIndex >= draft.teams.length) draft.currentTeamIndex = draft.teams.length - 1;
      });

      collapsedTeamIndexes = new Set(
        Array.from(collapsedTeamIndexes)
          .filter((collapsedIndex) => collapsedIndex !== index)
          .map((collapsedIndex) => collapsedIndex > index ? collapsedIndex - 1 : collapsedIndex)
      );
    }

    function addDeveloper(teamIndex) {
      // Keep the team card open by removing it from collapsed set before render
      collapsedTeamIndexes.delete(teamIndex);
      update((draft) => {
        draft.developers.push({ teamIndex, name: DEFAULT_NEW_DEVELOPER_NAME });
        draft.developerCapacity.push(state.sprints.map((_, sprintIndex) => ({
          capacity: state.sprints[sprintIndex]?.days ?? 10,
          isDefault: true
        })));
        draft.currentDeveloperIndex = draft.developers.length - 1;
        pendingDeveloperFocusIndex = draft.currentDeveloperIndex;
      });
    }

    function resetSelectedTeamCapacityForSprint() {
      update((draft) => {
        const sprintIndex = draft.currentSprintIndex;
        const sprintDays = Math.max(0, numberValue(draft.sprints[sprintIndex]?.days));
        draft.developers.forEach((developer, developerIndex) => {
          if (developer.teamIndex !== draft.currentTeamIndex) return;
          if (!draft.developerCapacity[developerIndex]?.[sprintIndex]) return;
          draft.developerCapacity[developerIndex][sprintIndex].capacity = sprintDays;
          draft.developerCapacity[developerIndex][sprintIndex].isDefault = false;
        });
        pendingCapacityToast = null;
      });
    }

    function deleteDeveloper(index) {
      // Keep the team card open by removing it from collapsed set before render
      const developer = state.developers[index];
      if (developer) {
        collapsedTeamIndexes.delete(developer.teamIndex);
      }
      update((draft) => {
        if (!canDeleteDeveloper(index)) return;
        draft.developers.splice(index, 1);
        draft.developerCapacity.splice(index, 1);
        if (draft.currentDeveloperIndex > index) draft.currentDeveloperIndex -= 1;
        if (draft.currentDeveloperIndex >= draft.developers.length) draft.currentDeveloperIndex = draft.developers.length - 1;
      });
    }

    function nextSprintName(previousName, fallbackIndex) {
      if (!previousName) return `Sprint ${fallbackIndex}`;
      const match = previousName.match(/(\d+)(?!.*\d)/);
      if (!match || match.index === undefined) return `${previousName} ${fallbackIndex}`;

      const nextNumber = String(Number(match[1]) + 1).padStart(match[1].length, '0');
      return `${previousName.slice(0, match.index)}${nextNumber}${previousName.slice(match.index + match[1].length)}`;
    }

    function moveIndex(oldIndex, fromIndex, toIndex) {
      if (oldIndex === fromIndex) return toIndex;
      if (fromIndex < toIndex && oldIndex > fromIndex && oldIndex <= toIndex) return oldIndex - 1;
      if (fromIndex > toIndex && oldIndex >= toIndex && oldIndex < fromIndex) return oldIndex + 1;
      return oldIndex;
    }

    function moveArrayItem(items, fromIndex, toIndex) {
      const [item] = items.splice(fromIndex, 1);
      items.splice(toIndex, 0, item);
    }

    function addSprint() {
      update((draft) => {
        const last = draft.sprints[draft.sprints.length - 1];
        const nextDays = last ? last.days : 10;
        const selectedPlanIndex = Number.isInteger(draft.currentPlanIndex)
          && draft.currentPlanIndex >= 0
          && draft.currentPlanIndex < draft.releases.length
          ? draft.currentPlanIndex
          : null;
        draft.sprints.push({
          name: nextSprintName(last?.name, draft.sprints.length),
          days: nextDays,
          releaseIndex: selectedPlanIndex
        });
        draft.developerCapacity.forEach((row) => row.push({ capacity: nextDays, isDefault: true }));
        draft.teamVelocity.forEach((row) => row.push({ commit: 0, actual: 0, capacityDays: 0, estimate: 0, actualPerDay: 0 }));
        draft.currentSprintIndex = draft.sprints.length - 1;
      });
    }

    function addRelease() {
      update((draft) => {
        const last = draft.releases[draft.releases.length - 1];
        draft.releases.push({ name: nextSprintName(last?.name, draft.releases.length) });
        draft.currentPlanIndex = draft.releases.length - 1;
      });
    }

    function deleteRelease(index) {
      update((draft) => {
        if (draft.releases.length < 2) return;
        draft.releases.splice(index, 1);
        draft.sprints.forEach((sprint) => {
          if (!Number.isFinite(sprint.releaseIndex)) {
            sprint.releaseIndex = null;
            return;
          }
          if (sprint.releaseIndex === index) {
            sprint.releaseIndex = null;
          } else if (sprint.releaseIndex > index) {
            sprint.releaseIndex -= 1;
          }
        });
        draft.currentPlanIndex = clampIndex(draft.currentPlanIndex, draft.releases.length - 1);
      });
    }

    function deleteSprint(index) {
      update((draft) => {
        if (draft.sprints.length < 2) return;
        draft.sprints.splice(index, 1);
        draft.developerCapacity.forEach((row) => row.splice(index, 1));
        draft.teamVelocity.forEach((row) => row.splice(index, 1));

        if (draft.currentSprintIndex > index || draft.currentSprintIndex >= draft.sprints.length) {
          draft.currentSprintIndex = Math.max(0, draft.currentSprintIndex - 1);
        }
        if (draft.masterSprintIndex > index || draft.masterSprintIndex >= draft.sprints.length) {
          draft.masterSprintIndex = Math.max(0, draft.masterSprintIndex - 1);
        }
      });
    }

    function moveSprint(fromIndex, toIndex) {
      update((draft) => {
        if (fromIndex === toIndex) return;
        if (fromIndex < 0 || toIndex < 0 || fromIndex >= draft.sprints.length || toIndex >= draft.sprints.length) return;

        moveArrayItem(draft.sprints, fromIndex, toIndex);
        draft.developerCapacity.forEach((row) => moveArrayItem(row, fromIndex, toIndex));
        draft.teamVelocity.forEach((row) => moveArrayItem(row, fromIndex, toIndex));

        draft.currentSprintIndex = moveIndex(draft.currentSprintIndex, fromIndex, toIndex);
        draft.masterSprintIndex = moveIndex(draft.masterSprintIndex, fromIndex, toIndex);
      });
    }

    function moveRelease(fromIndex, toIndex) {
      update((draft) => {
        if (fromIndex === toIndex) return;
        if (fromIndex < 0 || toIndex < 0 || fromIndex >= draft.releases.length || toIndex >= draft.releases.length) return;

        moveArrayItem(draft.releases, fromIndex, toIndex);
        
        // Update all sprint releaseIndex values
        draft.sprints.forEach((sprint) => {
          sprint.releaseIndex = moveIndex(sprint.releaseIndex, fromIndex, toIndex);
        });
        
        // Update current plan selection
        draft.currentPlanIndex = moveIndex(draft.currentPlanIndex, fromIndex, toIndex);
      });
    }

    function purgeOldSprints() {
      if (state.masterSprintIndex <= 10) return;
      const cutoff = state.masterSprintIndex - 10;
      const firstSprintName = state.sprints[0]?.name ?? 'Unknown';
      const lastSprintName = state.sprints[cutoff - 1]?.name ?? 'Unknown';
      
      isPurgeConfirmOpen = true;
      purgeSprintRange = { firstSprintName, lastSprintName, cutoff };
      render();

    function confirmPurgeOldSprints() {
      if (state.masterSprintIndex <= 10) return;
      const cutoff = state.masterSprintIndex - 10;
      update((draft) => {
        draft.sprints.splice(0, cutoff);
        draft.developerCapacity.forEach((row) => row.splice(0, cutoff));
        draft.teamVelocity.forEach((row) => row.splice(0, cutoff));
        draft.currentSprintIndex = Math.max(0, draft.currentSprintIndex - cutoff);
        draft.masterSprintIndex = Math.max(0, draft.masterSprintIndex - cutoff);
      });
      isPurgeConfirmOpen = false;
      purgeSprintRange = null;
    }

    function cancelPurgeOldSprints() {

    function renderHome() {
      const summary = pointsSummary(state.masterSprintIndex);

      const nextSprintName = state.sprints[state.masterSprintIndex + 1]?.name ?? 'Next sprint';
      const nextSprintIndex = state.masterSprintIndex + 1;
      const hasNextSprint = nextSprintIndex < state.sprints.length;
      const currentSprintDays = Math.max(0, numberValue(state.sprints[state.masterSprintIndex]?.days));
      const nextSprintDays = hasNextSprint ? Math.max(0, numberValue(state.sprints[nextSprintIndex]?.days)) : 0;
      const totalDevelopers = state.developers.length;
      const totalTeams = state.teams.length;
      const previousSprintIndex = state.masterSprintIndex - 1;
      const confirmedNextSprintDevelopers = hasNextSprint
        ? state.developerCapacity.reduce((count, row) => (row[nextSprintIndex]?.isDefault === false ? count + 1 : count), 0)
        : 0;
      const readinessPercent = totalDevelopers > 0
        ? Math.max(0, Math.min(100, Math.round((confirmedNextSprintDevelopers / totalDevelopers) * 100)))
        : 0;
      const missingPreviousActualTeams = previousSprintIndex >= 0
        ? state.teamVelocity.reduce((count, row) => {
            const value = numberValue(row[previousSprintIndex]?.actual);
            return value > 0 ? count : count + 1;
          }, 0)
        : 0;
      const hasMissingPreviousActuals = missingPreviousActualTeams > 0;
      const nextSprintAvailableDays = hasNextSprint
        ? state.developerCapacity.reduce((sum, row) => {
            const entry = row[nextSprintIndex];
            const hasCapacityValue = entry && Number.isFinite(Number(entry.capacity));
            const available = hasCapacityValue
              ? clampCapacityToSprintDays(entry.capacity, nextSprintIndex)
              : nextSprintDays;
            return sum + available;
          }, 0)
        : 0;
      const totalForecast = hasNextSprint ? summary.estimated : 0;
      return `

            </div>
          </div>

          <div class="card">
            <div class="section-title">
              <h2>Next sprint readiness</h2>
            </div>
            <div class="snapshot-layout">
              <div class="snapshot-hero">
                <div class="snapshot-hero-label">TEAM CAPACITY CONFIRMED</div>
                <div class="snapshot-hero-value">${readinessPercent}%</div>
                <div class="footnote">${hasNextSprint ? `${confirmedNextSprintDevelopers} of ${totalDevelopers} developers confirmed for ${escapeHtml(nextSprintName)}` : 'No next sprint available'}</div>
                <div class="snapshot-progress"><span style="width:${readinessPercent}%;"></span></div>
              </div>
              <div class="snapshot-stat-grid">
                <div class="snapshot-stat">
                  <div class="snapshot-stat-label">Total Sprint Man Days</div>
                  <div class="snapshot-stat-value">${nextSprintAvailableDays.toFixed(nextSprintAvailableDays % 1 === 0 ? 0 : 1)}</div>
                </div>
                <div class="snapshot-stat">
                  <div class="snapshot-stat-label">Forecast velocity</div>
                  <div class="snapshot-stat-value">${totalForecast.toFixed(0)}</div>
                </div>
                <div
                  class="snapshot-stat ${hasMissingPreviousActuals ? 'warn clickable ' : ''}full-width"
                  ${hasMissingPreviousActuals
                    ? 'data-action="open-missing-actuals" role="button" tabindex="0" aria-label="Open Velocity tab by Sprint and focus the squad with most missing previous sprint actuals" title="Open Velocity tab by Sprint and focus the squad with most missing previous sprint actuals"'

          <div class="card">
            <div class="section-title">
              <h2>Data being used</h2>
            </div>
            <div class="snapshot-stat-grid">
              <div class="snapshot-stat clickable" data-action="open-teams-squads" role="button" tabindex="0" aria-label="Open Teams tab with squads section expanded" title="Open Teams tab with squads section expanded">
                <div class="snapshot-stat-label">Squads</div>
                <div class="snapshot-stat-value">${state.squads.length}</div>
              </div>
              <div class="snapshot-stat clickable" data-action="open-sprints" role="button" tabindex="0" aria-label="Open Sprints tab" title="Open Sprints tab">
                <div class="snapshot-stat-label">Sprints</div>
                <div class="snapshot-stat-value">${state.sprints.length}</div>
              </div>
              <div class="snapshot-stat clickable" data-action="open-teams" role="button" tabindex="0" aria-label="Open Teams tab with squads section collapsed" title="Open Teams tab with squads section collapsed">
                <div class="snapshot-stat-label">Teams</div>
                <div class="snapshot-stat-value">${totalTeams}</div>
              </div>
              <div class="snapshot-stat clickable" data-action="open-developers" role="button" tabindex="0" aria-label="Open Teams tab with squads section collapsed" title="Open Teams tab with squads section collapsed">
                <div class="snapshot-stat-label">Developers</div>
                <div class="snapshot-stat-value">${totalDevelopers}</div>
              </div>
            </div>
          </div>
        </div>

        <div class="card" style="margin-top:16px;">
          <div class="section-title">
            <h2>Data storage</h2>
          </div>
          <p class="subtle">For privacy reasons, all changes are saved locally in this browser only. No information is uploaded to any cloud service</p>
          <p class="subtle">You can manually save and restore data locally using the actions below</p>
          <div class="storage-action-grid">
            <div class="storage-action clickable" data-action="export-data">
              <button class="ghost-btn storage-icon-btn" data-action="export-data" title="Export data" aria-label="Export data">⤓</button>
              <div class="storage-action-title">Export Data</div>
              <div class="storage-action-text">Export data downloads a JSON backup file</div>
              <div class="storage-action-text storage-action-meta"><strong>Last exported:</strong> ${escapeHtml(formatStorageTimestamp(storageMeta.exportedAt))}</div>
            </div>
            <div class="storage-action clickable" data-action="import-data">
              <button class="ghost-btn storage-icon-btn" data-action="import-data" title="Import data" aria-label="Import data">⤒</button>
              <div class="storage-action-title">Import Data</div>
              <div class="storage-action-text">Import data loads a previously exported JSON file</div>
              <div class="storage-action-text storage-action-meta"><strong>Last imported:</strong> ${escapeHtml(formatStorageTimestamp(storageMeta.importedAt))}</div>
            </div>
            <input type="file" accept="application/json,.json" data-action="import-data-file" style="display:none;">
          </div>
          <p class="subtle" style="margin-top:14px;">Use ↺ below to restore the default sample data</p>
          <div class="storage-action-grid" style="margin-top:8px;">
            <div class="storage-action storage-action-reset">
              <button class="danger-btn storage-icon-btn" data-action="reset-data" title="Reset data" aria-label="Reset data">↺</button>
              <div class="storage-action-title">Reset Data</div>
              <div class="storage-action-text">Reset data clears all configuration and restores the default sample data</div>
            </div>
          </div>
        </div>
        <div style="font-size:11px; color:#a0aec0; margin-top:24px; padding-left:4px;">Version v1.1</div>
      `;
    }

    function renderVelocity() {
      const bySprint = state.velocityMode === 'sprint';
      const currentPlanName = state.releases[state.currentPlanIndex]?.name ?? 'Selected plan';
      const teamPlanSprintIndexes = sprintIndexesForPlan(state.currentPlanIndex);
      const summary = bySprint
        ? velocitySummary(true, state.currentSquadIndex, state.currentSprintIndex)
        : velocitySummaryForTeam(state.currentTeamIndex, teamPlanSprintIndexes);
      const currentSquadName = state.squads[state.currentSquadIndex]?.name ?? 'Selected squad';
      const teamOptions = state.teams
        .map((team, index) => ({ index, ...team }))
        .filter((team) => team.squadIndex === state.currentSquadIndex);
      const previousData = bySprint
        ? previousSprintDataStatus(teamOptions.map((team) => team.index), state.currentSprintIndex)
        : previousSprintDataStatus([state.currentTeamIndex], state.masterSprintIndex);
      const previousDataTag = previousData.hasMissing
        ? `<span class="pill warn" title="${escapeHtml(previousData.label)}">Missing previous sprint data</span>`
        : '';
      const squadSelect = `
        <label>
          <span class="label">Squad</span>
          <select data-action="select-squad">
            ${state.squads.map((squad, index) => `<option value="${index}" ${index === state.currentSquadIndex ? 'selected' : ''}>${escapeHtml(squad.name)}</option>`).join('')}
          </select>
        </label>
      `;

      const summaryHtml = `
        <div class="grid summary-grid summary-tiles-4 velocity-summary-grid summary-box-format" style="margin-top:16px;">
          ${summaryCard('Forecast', summary.estimated.toFixed(0), 'points', previousData.hasMissing ? 'velocity-forecast-alert' : '')}
          ${summaryCard('Committed', summary.committed.toFixed(0), 'points')}
          ${summaryCard('Actual', summary.actual.toFixed(0), 'points')}
          ${summaryCard('Predictability', `${summary.predictabilityCommit.toFixed(0)}%`, `Forecast: ${summary.predictabillityEstimate.toFixed(0)}%`)}
        </div>
      `;

      if (bySprint) {
        const rows = teamOptions.map((team) => {
          const row = state.teamVelocity[team.index]?.[state.currentSprintIndex] ?? {};
          const isFutureSprint = state.currentSprintIndex > state.masterSprintIndex;
          const previousMissing = previousSprintMissingForTeam(team.index, state.currentSprintIndex);
          const actualClass = previousMissing.missingActual ? 'missing-previous-data-input' : '';
          return `
            <tr>
              <td>${escapeHtml(team.name)}</td>
              <td><input type="number" step="any" data-action="edit-velocity" data-team="${team.index}" data-sprint="${state.currentSprintIndex}" data-field="estimate" value="${escapeHtml(row.estimate ?? 0)}" disabled></td>
              <td><input type="number" step="any" data-action="edit-velocity" data-team="${team.index}" data-sprint="${state.currentSprintIndex}" data-field="commit" value="${escapeHtml(row.commit ?? 0)}" ${isFutureSprint ? 'disabled' : ''}></td>
              <td><input class="${actualClass}" type="number" step="any" data-action="edit-velocity" data-team="${team.index}" data-sprint="${state.currentSprintIndex}" data-field="actual" value="${escapeHtml(row.actual ?? 0)}" ${isFutureSprint ? 'disabled' : ''}></td>
              <td><input type="text" data-action="noop" value="${escapeHtml(row.commit > 0 && row.actual > 0 ? ((numberValue(row.actual) / numberValue(row.commit)) * 100).toFixed(0) + ' %' : '0 %')}" disabled></td>
            </tr>
          `;
        }).join('');

        return `
          <div class="card">
            <div class="toolbar">
              <div class="segmented">
                <button class="seg-btn active" data-action="set-velocity-mode" data-mode="sprint">by Sprint</button>
                <button class="seg-btn" data-action="set-velocity-mode" data-mode="team">by Team</button>
              </div>
            </div>
          </div>

          <div class="grid velocity-sprint-stack" style="margin-top:16px;">
            <div class="card">
              <div class="section-title">
                <h2>Sprint</h2>
              </div>
              <div class="selector-stack">
                <label>
                  <span class="label">Select sprint</span>
                  <select data-action="select-sprint">
                    ${state.sprints.slice().reverse().map((sprint, reverseIndex) => {
                      const index = state.sprints.length - 1 - reverseIndex;
                      const label = index === state.masterSprintIndex ? `${sprint.name} (current)` : sprint.name;
                      return `<option value="${index}" ${index === state.currentSprintIndex ? 'selected' : ''}>${escapeHtml(label)}</option>`;
                    }).join('')}
                  </select>
                </label>
                ${squadSelect}
              </div>
            </div>

            <div class="card">
              <div class="section-title velocity-team-summary-header">
                <h2>Velocity and Forecast team capacity</h2>
                <div class="inline-actions">
                  <span class="pill">${escapeHtml(`${currentSquadName} teams`)}</span>
                  ${previousDataTag}
                </div>
              </div>
              <div class="table-wrap">
                <table class="table sprint-table">
                  <thead>
                    <tr>
                      <th>${bySprint ? 'Team' : 'Sprint'}</th>
                      <th>Forecast</th>
                      <th>Commit</th>
                      <th>Actual</th>
                      <th>Predict</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${bySprint
                      ? rows || `<tr><td colspan="5"><div class="muted-box">No teams in this squad yet</div></td></tr>`
                      : state.sprints.slice().reverse().map((sprint, reverseIndex) => {
                          const index = state.sprints.length - 1 - reverseIndex;
                          const row = state.teamVelocity[state.currentTeamIndex]?.[index] ?? {};
                          return `
                            <tr>
                              <td>${escapeHtml(sprint.name)} ${index === state.masterSprintIndex ? '<span class="pill good velocity-inline-current">current</span>' : ''}</td>
                              <td><input type="number" step="any" data-action="edit-velocity" data-team="${state.currentTeamIndex}" data-sprint="${index}" data-field="estimate" value="${escapeHtml(row.estimate ?? 0)}" disabled></td>
                              <td><input type="number" step="any" data-action="edit-velocity" data-team="${state.currentTeamIndex}" data-sprint="${index}" data-field="commit" value="${escapeHtml(row.commit ?? 0)}" ${index > state.masterSprintIndex ? 'disabled' : ''}></td>
                              <td><input type="number" step="any" data-action="edit-velocity" data-team="${state.currentTeamIndex}" data-sprint="${index}" data-field="actual" value="${escapeHtml(row.actual ?? 0)}" ${index > state.masterSprintIndex ? 'disabled' : ''}></td>
                              <td><input type="text" value="${escapeHtml(row.commit > 0 && row.actual > 0 ? ((numberValue(row.actual) / numberValue(row.commit)) * 100).toFixed(0) + ' %' : '0 %')}" disabled></td>
                            </tr>
                          `;
                        }).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          ${summaryHtml}
        `;
      }

      const selectedTeam = state.teams[state.currentTeamIndex];
      return `
        <div class="card">
          <div class="toolbar">
            <div class="segmented">
              <button class="seg-btn" data-action="set-velocity-mode" data-mode="sprint">by Sprint</button>
              <button class="seg-btn active" data-action="set-velocity-mode" data-mode="team">by Team</button>
            </div>
          </div>
        </div>

        <div class="grid velocity-team-stack" style="margin-top:16px;">
          <div class="card">
            <div class="section-title">
              <h2>Team</h2>
            </div>
            <div class="selector-stack">
              ${squadSelect}
              <label>
                <span class="label">Select team</span>
                <select data-action="select-team">
                  ${state.teams
                    .map((team, index) => ({ team, index }))
                    .filter(({ team }) => team.squadIndex === state.currentSquadIndex)
                    .map(({ team, index }) => `<option value="${index}" ${index === state.currentTeamIndex ? 'selected' : ''}>${escapeHtml(team.name)}</option>`)
                    .join('')}
                </select>
              </label>
              <label>
                <span class="label">Select plan</span>
                <select data-action="select-velocity-plan">
                  ${state.releases.map((release, index) => `<option value="${index}" ${index === state.currentPlanIndex ? 'selected' : ''}>${escapeHtml(release.name)}</option>`).join('')}
                </select>
              </label>
            </div>
          </div>
        </div>

        <div class="card" style="margin-top:16px;">
          <div class="section-title velocity-team-summary-header">
            <h2>Velocity and Forecast team capacity</h2>
            <div class="inline-actions">
              <span class="pill">${escapeHtml(`${selectedTeam?.name ?? 'Selected'} team`)}</span>
              <span class="pill">${escapeHtml(currentPlanName)}</span>
              ${previousDataTag}
            </div>
          </div>
          <div class="table-wrap velocity-team-sprints-wrap" style="overflow-x:hidden;">
            <table class="table velocity-team-sprints-table" style="width:100%;max-width:100%;">
              <thead>
                <tr>
                  <th>Sprint</th>
                  <th>Forecast</th>
                  <th>Commit</th>
                  <th>Actual</th>
                  <th>Predict</th>
                </tr>
              </thead>
              <tbody>
                ${(() => {
                  const teamVelocityRows = state.teamVelocity[state.currentTeamIndex] ?? [];
                  const planSprintSet = new Set(teamPlanSprintIndexes);
                  let latestPastActualIndex = -1;
                  for (let i = state.masterSprintIndex - 1; i >= 0; i -= 1) {
                    if (!planSprintSet.has(i)) continue;
                    if (numberValue(teamVelocityRows[i]?.actual) > 0) {
                      latestPastActualIndex = i;
                      break;
                    }
                  }

                  const planSprints = state.sprints
                    .map((sprint, index) => ({ sprint, index }))
                    .filter(({ sprint }) => sprint.releaseIndex === state.currentPlanIndex)
                    .reverse();

                  if (!planSprints.length) {
                    return '<tr><td colspan="5"><div class="muted-box">No sprints in this plan yet</div></td></tr>';
                  }

                  return planSprints.map(({ sprint, index }) => {
                  const row = state.teamVelocity[state.currentTeamIndex]?.[index] ?? {};
                  const shouldHighlightActual =
                    index < state.masterSprintIndex
                    && index > latestPastActualIndex
                    && numberValue(row.actual) <= 0;
                  return `
                    <tr>
                      <td>${escapeHtml(sprint.name)} ${index === state.masterSprintIndex ? '<span class="pill good velocity-inline-current">current</span>' : ''}</td>
                      <td><input type="number" step="any" data-action="edit-velocity" data-team="${state.currentTeamIndex}" data-sprint="${index}" data-field="estimate" value="${escapeHtml(row.estimate ?? 0)}" disabled></td>
                      <td><input type="number" step="any" data-action="edit-velocity" data-team="${state.currentTeamIndex}" data-sprint="${index}" data-field="commit" value="${escapeHtml(row.commit ?? 0)}" ${index > state.masterSprintIndex ? 'disabled' : ''}></td>
                      <td><input class="${shouldHighlightActual ? 'missing-previous-data-input' : ''}" type="number" step="any" data-action="edit-velocity" data-team="${state.currentTeamIndex}" data-sprint="${index}" data-field="actual" value="${escapeHtml(row.actual ?? 0)}" ${index > state.masterSprintIndex ? 'disabled' : ''}></td>
                      <td><input type="text" value="${escapeHtml(row.commit > 0 && row.actual > 0 ? ((numberValue(row.actual) / numberValue(row.commit)) * 100).toFixed(0) + ' %' : '0 %')}" disabled></td>
                    </tr>
                  `;
                }).join('');
                })()}
              </tbody>
            </table>
          </div>
        </div>

        ${summaryHtml}
      `;
    }

    function renderCapacity() {
      const currentTeam = getCurrentTeam();
      const teamValid = currentTeam && currentTeam.squadIndex === state.currentSquadIndex;
      const selectedSprintName = state.sprints[state.currentSprintIndex]?.name ?? 'No sprint selected';
      const summary = teamValid ? capacitySummary(state.currentTeamIndex, state.currentSprintIndex) : { potential: 0, capacity: 0, lost: 0 };
      const teamOptions = state.teams
        .map((team, index) => ({ index, ...team }))
        .filter((team) => team.squadIndex === state.currentSquadIndex);

      const selectedSprintDays = state.sprints[state.currentSprintIndex]?.days ?? 0;
      const rows = teamValid
        ? state.developers
            .map((developer, index) => ({ developer, index }))
            .filter(({ developer }) => developer.teamIndex === state.currentTeamIndex)
            .map(({ developer, index }) => {
              const row = state.developerCapacity[index]?.[state.currentSprintIndex] ?? {};
              const capacityValue = numberValue(row.capacity ?? 0);
              const isDefaultAvailable = typeof row.isDefault === 'boolean'
                ? row.isDefault
                : Math.abs(capacityValue - selectedSprintDays) < 1e-9;
              const capacityToast = pendingCapacityToast
                && pendingCapacityToast.developerIndex === index
                && pendingCapacityToast.sprintIndex === state.currentSprintIndex
                ? `<span class="capacity-toast">${escapeHtml(pendingCapacityToast.message)}</span>`
                : '';
              return `
                <tr>
                  <td>${escapeHtml(developer.name)}</td>
                  <td>
                    <div class="capacity-input-wrap">
                      ${capacityToast}
                      <input class="available-input ${isDefaultAvailable ? 'default-available' : ''}" type="number" step="any" min="0" max="${escapeHtml(selectedSprintDays)}" data-action="edit-capacity" data-developer="${index}" data-sprint="${state.currentSprintIndex}" value="${escapeHtml(row.capacity ?? 0)}">
                    </div>
                  </td>
                </tr>
              `;
            }).join('')
        : '';

      return `
        <div class="card">
          <div class="section-title">
            <h2>Capacity</h2>
          </div>
          <div class="fields two">
            <div class="selector-stack">
              <label>
                <span class="label">Squad</span>
                <select data-action="select-squad">
                  ${state.squads.map((squad, index) => `<option value="${index}" ${index === state.currentSquadIndex ? 'selected' : ''}>${escapeHtml(squad.name)}</option>`).join('')}
                </select>
              </label>
              <label>
                <span class="label">Team</span>
                <select data-action="select-team">
                  ${teamOptions.map(({ index, name }) => `<option value="${index}" ${index === state.currentTeamIndex ? 'selected' : ''}>${escapeHtml(name)}</option>`).join('')}
                </select>
              </label>
            </div>
            <label>
              <span class="label">Sprint</span>
              <select data-action="select-sprint">
                ${state.sprints.map((sprint, index) => `<option value="${index}" ${index === state.currentSprintIndex ? 'selected' : ''}>${escapeHtml(index === state.masterSprintIndex ? `${sprint.name} (current)` : sprint.name)}</option>`).join('')}
              </select>
            </label>
          </div>
        </div>

        <div class="card" style="margin-top:16px;">
          <div class="section-title">
            <h2>Selected team / sprint</h2>
          </div>
          ${teamValid
            ? `
              <div class="selection-info-grid">
                <div class="selection-info-card">
                  <span class="label">Team</span>
                  <div class="selection-info-value">${escapeHtml(currentTeam.name)}</div>
                </div>
                <div class="selection-info-card">
                  <span class="label">Sprint</span>
                  <div class="selection-info-value">${escapeHtml(selectedSprintName)}</div>
                </div>
              </div>
            `
            : '<div class="muted-box">No team from this squad is currently selected</div>'}
        </div>

        <div class="card" style="margin-top:16px;">
          <div class="section-title">
            <h2>Team capacity</h2>
            ${teamValid ? '<button class="primary-btn capacity-reset-btn" data-action="reset-team-capacity-sprint">Set to Max</button>' : ''}
          </div>
          ${teamValid
            ? `
              <div class="table-wrap team-capacity-wrap">
                <table class="table team-capacity-table">
                  <thead>
                    <tr>
                      <th>Developer</th>
                      <th>Days</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${rows}
                  </tbody>
                </table>
              </div>
            `
            : '<div class="muted-box">Team currently has no developers assigned</div>'}
        </div>

        <div class="grid summary-grid summary-tiles-3 summary-box-format" style="margin-top:16px;">
          ${summaryCard('Maximum', summary.potential.toFixed(summary.potential % 1 === 0 ? 0 : 1), 'days')}
          ${summaryCard('Capacity', summary.capacity.toFixed(summary.capacity % 1 === 0 ? 0 : 1), 'days')}
          ${summaryCard('Not available', summary.lost.toFixed(summary.lost % 1 === 0 ? 0 : 1), 'days')}
        </div>
      `;
    }

    function renderTeams() {
      const currentSquadTeams = state.teams
        .map((team, index) => ({ team, index }))
        .filter(({ team }) => team.squadIndex === state.currentSquadIndex);

      const squadRows = state.squads.map((squad, index) => `
        <div class="row-card ${index === state.currentSquadIndex ? 'selected-squad-card' : ''}">
          <div class="row-head">
            <div class="row-title">
              <span class="pill">Squad ${index + 1}</span>
              <strong>${escapeHtml(squad.name)}</strong>
            </div>
            <div class="inline-actions">
              <button class="${index === state.currentSquadIndex ? 'squad-selected-btn' : 'ghost-btn small squad-select-btn'}" data-action="set-current-squad" data-index="${index}">${index === state.currentSquadIndex ? 'Selected' : 'Select'}</button>
              <button
                class="danger-btn small squad-delete-btn ${canDeleteSquad(index) ? '' : 'blocked-delete-btn'}"
                data-action="${canDeleteSquad(index) ? 'delete-squad' : 'show-squad-delete-blocked'}"
                data-index="${index}"
              >
                Delete squad
              </button>
            </div>
          </div>
          <label>
            <span class="label">Squad name</span>
            <input class="squad-name-input ${squad.name === DEFAULT_NEW_SQUAD_NAME ? 'default-squad-name' : ''}" type="text" data-action="edit-squad-name" data-index="${index}" value="${escapeHtml(squad.name)}">
          </label>
        </div>
      `).join('');

      const teamRows = currentSquadTeams.map(({ team, index }) => {
        const members = state.developers
          .map((developer, devIndex) => ({ developer, devIndex }))
          .filter(({ developer }) => developer.teamIndex === index);

        return `
          <details class="row-card team-section" data-action="toggle-team-section" data-index="${index}" ${collapsedTeamIndexes.has(index) ? '' : 'open'}>
            <summary class="team-summary">
              <div class="team-summary-row">
                <div class="row-title">
                  <span class="pill">Team ${index + 1}</span>
                  <strong>${escapeHtml(team.name)}</strong>
                </div>
                <div class="inline-actions">
                  <button
                    class="danger-btn small team-delete-btn ${canDeleteTeam(index) ? '' : 'blocked-delete-btn'}"
                    data-action="${canDeleteTeam(index) ? 'delete-team' : 'show-team-delete-blocked'}"
                    data-index="${index}"
                  >
                    Delete team
                  </button>
                </div>
              </div>
            </summary>

            <div class="team-content">
              <div class="fields two">
                <label>
                  <span class="label">Team name</span>
                  <input class="team-name-input ${team.name === DEFAULT_NEW_TEAM_NAME ? 'default-team-name' : ''}" type="text" data-action="edit-team-name" data-index="${index}" value="${escapeHtml(team.name)}">
                </label>
                <label>
                  <span class="label">Squad</span>
                  <select data-action="edit-team-squad" data-index="${index}">
                    ${state.squads.map((squad, squadIndex) => `<option value="${squadIndex}" ${squadIndex === team.squadIndex ? 'selected' : ''}>${escapeHtml(squad.name)}</option>`).join('')}
                  </select>
                </label>
              </div>

              <div class="team-members">
                <div class="label">Development Team</div>
                ${members.map(({ developer, devIndex }) => `
                  <div class="member-row">
                    <input class="member-name-input ${developer.name === DEFAULT_NEW_DEVELOPER_NAME ? 'default-dev-name' : ''}" type="text" data-action="edit-developer-name" data-index="${devIndex}" value="${escapeHtml(developer.name)}" placeholder="Member name">
                    <button class="danger-btn small" data-action="delete-developer" data-index="${devIndex}" ${canDeleteDeveloper(devIndex) ? '' : 'disabled'}>Delete</button>
                  </div>
                `).join('')}
                <div class="inline-actions">
                  <button class="primary-btn small" data-action="add-developer" data-index="${index}">Add Developer</button>
                </div>
              </div>
            </div>
          </details>
        `;
      }).join('');

      return `
        <div class="stack">
          <div class="card">
            <div class="section-title">
              <button class="squads-toggle-btn" data-action="toggle-squads-section">
                <span class="squads-toggle-icon">${isSquadsSectionCollapsed ? '▸' : '▾'}</span>
                <span>Squads</span>
              </button>
              <button class="primary-btn small" data-action="add-squad">Add squad</button>
            </div>
            ${isSquadsSectionCollapsed
              ? `
                <div class="squads-collapsed-select">
                  <label>
                    <span class="label">Selected squad</span>
                    <select data-action="select-squad">
                      ${state.squads.map((squad, index) => `<option value="${index}" ${index === state.currentSquadIndex ? 'selected' : ''}>${escapeHtml(squad.name)}</option>`).join('')}
                    </select>
                  </label>
                </div>
              `
              : `<div class="row-stack">${squadRows}</div>`}
          </div>

          <div class="card">
            <div class="section-title">

            <div class="row-stack">
              ${teamRows || '<div class="muted-box">No teams in this squad yet</div>'}
            </div>
          </div>
        </div>
      `;
    }

    function renderSprints() {
      const canPurge = state.masterSprintIndex > 10;
      const showSelectedPlanSprintsOnly = state.showSelectedPlanSprintsOnly === true;
      const visibleSprints = state.sprints
        .map((sprint, index) => ({ sprint, index }))
        .filter(({ sprint }) => !showSelectedPlanSprintsOnly || sprint.releaseIndex === state.currentPlanIndex)
        .reverse();
      const selectedPlanName = state.releases[state.currentPlanIndex]?.name ?? `Plan ${state.currentPlanIndex + 1}`;
      const releaseRows = state.releases.map((release, index) => {
        const sprintCount = state.sprints.reduce((count, sprint) => (
          sprint.releaseIndex === index ? count + 1 : count
        ), 0);
        return `
         <div class="row-card ${index === state.currentPlanIndex ? 'selected-squad-card' : ''}" draggable="true" data-plan-row data-index="${index}">
            <div class="row-head">
             <div style="display: flex; align-items: center;">
               <div class="row-card-drag-handle">
                 <span class="drag-handle" aria-hidden="true" title="Drag to reorder">☰</span>
               </div>
               <div class="row-title">
                 <span class="pill">Plan ${index + 1}</span>
                 <strong>${escapeHtml(release.name)}</strong>
               </div>
             </div>
             <div class="inline-actions">
               <button class="${index === state.currentPlanIndex ? 'squad-selected-btn' : 'ghost-btn small squad-select-btn'}" data-action="set-current-plan" data-index="${index}">${index === state.currentPlanIndex ? 'Selected' : 'Select'}</button>
               <button class="danger-btn small" data-action="delete-release" data-index="${index}" ${state.releases.length > 1 ? '' : 'disabled'}>
                 ${state.releases.length > 1 ? 'Delete' : 'Last plan'}
               </button>
             </div>
           </div>
           <div class="subtle" style="margin-bottom:10px;">${sprintCount} sprint${sprintCount === 1 ? '' : 's'}</div>
           <label>
             <span class="label">Plan name</span>
             <input type="text" data-action="edit-release-name" data-index="${index}" value="${escapeHtml(release.name)}" placeholder="Plan name">
           </label>
         </div>
       `;
      }).join('');

      return `
        <div class="card">
          <div class="section-title">
            <button class="squads-toggle-btn" data-action="toggle-plans-section">
              <span class="squads-toggle-icon">${isPlansSectionCollapsed ? '▸' : '▾'}</span>
              <span>Plans</span>
            </button>
            <button class="primary-btn small" data-action="add-release">Add plan</button>
          </div>
          ${isPlansSectionCollapsed
            ? `
              <div class="squads-collapsed-select">
                <label>
                  <span class="label">Selected plan</span>
                  <select data-action="select-plan">
                    ${state.releases.map((release, index) => `<option value="${index}" ${index === state.currentPlanIndex ? 'selected' : ''}>${escapeHtml(release.name)}</option>`).join('')}
                  </select>
                </label>
              </div>
            `
            : `
              <div class="row-stack" style="margin-top:12px; position: relative;">
                ${releaseRows || '<div class="muted-box">No plans defined</div>'}
                <div class="plan-drop-line" aria-hidden="true"></div>
              </div>
            `}
        </div>

        <div class="card" style="margin-top:16px;">
          <div class="section-title">
            <h2>Sprints</h2>
            <div class="inline-actions">
              <label class="inline-check" title="Show only sprints assigned to the selected plan">
                <span class="inline-switch">
                  <input type="checkbox" data-action="toggle-selected-plan-sprints" aria-label="Show only selected plan sprints" ${showSelectedPlanSprintsOnly ? 'checked' : ''}>
                  <span class="inline-switch-track" aria-hidden="true"></span>
                </span>
                <span>Selected plan only</span>
              </label>
              <button class="primary-btn small" data-action="add-sprint">Add sprint</button>
              ${canPurge
                ? '<button class="danger-btn small" data-action="purge-sprints">DELETE old sprints</button>'
                : '<button class="danger-btn blocked-delete-btn small" data-action="show-purge-sprints-blocked">DELETE old sprints</button>'}
            </div>
          </div>
          <div class="table-wrap sprints-table-wrap" style="margin-top:12px;">
            <table class="table sprints-table">
              <thead>
                <tr>
                  <th></th>
                  <th></th>
                  <th>Sprint name</th>
                  <th>Plan</th>
                  <th>Days</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                ${visibleSprints.length === 0
                  ? `
                    <tr>
                      <td colspan="6" class="muted-box">No sprints in ${escapeHtml(selectedPlanName)}</td>
                    </tr>
                  `
                  : visibleSprints.map(({ sprint, index }) => {
                  const isDraggable = !showSelectedPlanSprintsOnly;
                  return `
                    <tr class="sprint-row ${sprint.releaseIndex === state.currentPlanIndex ? 'selected-plan-sprint' : ''}" draggable="${isDraggable ? 'true' : 'false'}" data-sprint-row data-index="${index}">
                      <td class="drag-cell">
                        <span class="drag-handle" aria-hidden="true" title="${isDraggable ? 'Drag to reorder' : 'Disable filter to reorder'}">☰</span>

                        <button class="ghost-btn small current-sprint-btn ${index === state.masterSprintIndex ? 'is-current' : ''}" data-action="set-current-sprint" data-index="${index}">

                      <td>
                        <input type="text" data-action="edit-sprint-name" data-index="${index}" value="${escapeHtml(sprint.name)}">

                      <td>
                        <select data-action="edit-sprint-release" data-index="${index}">
                          <option value="">No plan</option>
                          ${state.releases.map((release, releaseIndex) => `<option value="${releaseIndex}" ${releaseIndex === sprint.releaseIndex ? 'selected' : ''}>${escapeHtml(release.name)}</option>`).join('')}
                        </select>

                      <td>
                        <input type="number" step="any" data-action="edit-sprint-days" data-index="${index}" value="${escapeHtml(sprint.days)}">

            <div class="sprint-drop-line" aria-hidden="true"></div>
          </div>

      `;
